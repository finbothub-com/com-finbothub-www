<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinBotHub Copyright and Takedown Policy</title>
  <!-- The legal documents are served by FinBotHub's sign-in server, which keeps the current version. -->
  <link rel="canonical" href="https://auth.finbothub.com/legal/copyright">
  <meta http-equiv="refresh" content="0; url=https://auth.finbothub.com/legal/copyright">
  <style>
    :root { --bg: #f4f6fa; --text: #1f2a3a; --accent: #16a34a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1520; --text: #e8edf5; --accent: #34d26b; } }
    body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--text); text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <p>FinBotHub's Copyright and Takedown Policy is at <a href="https://auth.finbothub.com/legal/copyright">auth.finbothub.com/legal/copyright</a>.</p>
  <script>location.replace("https://auth.finbothub.com/legal/copyright" + location.hash);</script>
</body>
</html>
